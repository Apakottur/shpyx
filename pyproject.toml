[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[dependency-groups]
dev = [
  "coverage-conditional-plugin==0.9.0",
  "httpx==0.28.1",
  "mypy==2.4.1",
  "prek==0.5.10",
  "pytest-cov==7.1.0",
  "pytest-mock==3.17.0",
  "pytest==9.2.0",
  "ruff==0.17.4",
  "ty==0.0.101",
  "types-psutil==7.2.2.20261111",
]
docs = [
  #
  "mkdocstrings-python==2.0.10",
  "zensical==0.1.1",
]

[project]
name = "shpyx"
dynamic = ["version"]
description = "Run shell commands in Python"
authors = [{ name = "Yossi Rozantsev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["shell", "bash", "terminal", "script", "subprocess", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["psutil>=7"]

[project.urls]
homepage = "https://github.com/Apakottur/shpyx"
repository = "https://github.com/Apakottur/shpyx"
documentation = "https://shpyx.readthedocs.io/"

[tool.hatch.version]
source = "vcs"

[tool.uv]
package = true
