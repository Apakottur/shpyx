[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "shpyx"
version = "0.0.35"
description = "Run shell commands in Python"
authors = [{name = "Yossi Rozantsev"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["shell", "bash", "terminal", "script"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "mypy==2.2.0",
  "pre-commit==4.6.0",
  "pytest-cov==7.1.0",
  "pytest-mock==3.15.1",
  "pytest==9.1.1",
  "ruff==0.15.21",
  "ty==0.0.58",
]

[project.urls]
homepage = "https://github.com/Apakottur/shpyx"
repository = "https://github.com/Apakottur/shpyx"
documentation = "https://github.com/Apakottur/shpyx"

[tool.hatch.build.targets.wheel]
packages = ["shpyx"]

[tool.uv]
package = true
