name: Setup Python
description: Install Python, uv and dependencies.

inputs:
  python-version:
    description: Python version to install.
    default: "3.14"

runs:
  using: "composite"
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - name: Install Python dependencies
      shell: bash
      run: uv sync --frozen
