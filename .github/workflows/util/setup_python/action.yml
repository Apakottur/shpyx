# Utility action that installs uv and the project's Python environment.
name: Setup Python
description: Install uv, the requested Python version, and the project dependencies.

inputs:
  python-version:
    description: Python version to install.
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - name: Install Python dependencies
      shell: bash
      run: uv sync --frozen
