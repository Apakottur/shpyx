# Configuration file for running unit tests with coverage measurement.
# References:
# 1. https://pytest-cov.readthedocs.io/en/latest/config.html
# 2. https://coverage.readthedocs.io/en/v4.5.x/config.html

[pytest]
# Execution options.
addopts =
    # Disable unused plugins to avoid overhead.
    -p no:anyio

    # Show slowest tests.
    --durations=5

    # Stop after X failures.
    --maxfail=5

    # Coverage configuration
    --cov-branch
    --cov-config=tests/pytest.ini
    --cov=src/shpyx
    --cov-report=term-missing:skip-covered
    --no-cov-on-fail
    --cov-fail-under=100

    # Run verbose, useful for seeing full assert information.
    -v

# Configuration of the underlying coverage.py application
[run]
plugins =
    coverage_conditional_plugin

[report]
# Regexes for lines to exclude from reports.
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    \.\.\.$
    if __name__ == .__main__.:

# Platform-specific pragmas, excluded from reports on platforms where the code cannot run.
# See: https://github.com/wemake-services/coverage-conditional-plugin
[coverage_conditional_plugin]
rules =
    "platform_system != 'Linux'": linux-only
    "platform_system != 'Darwin'": darwin-only
    "platform_system != 'Windows'": windows-only
    "platform_system == 'Windows'": unix-only
