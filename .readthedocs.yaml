# Read the Docs build: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    install:
      - pip install uv
      - uv sync --frozen --only-group docs
    build:
      html:
        - uv run --no-sync zensical build --strict
        - mkdir -p "$READTHEDOCS_OUTPUT/html/"
        - cp --recursive site/* "$READTHEDOCS_OUTPUT/html/"
